<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Puzzle icon -->
  <g transform="translate(480, 180)">
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#e94560"/>
    <rect x="60" y="0" width="50" height="50" rx="8" fill="#f9b208"/>
    <rect x="0" y="60" width="50" height="50" rx="8" fill="#4ecca3"/>
    <rect x="60" y="60" width="50" height="50" rx="8" fill="#7b68ee"/>
  </g>

  <!-- Title -->
  <text x="600" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle">React Puzzle Games</text>

  <!-- Subtitle -->
  <text x="600" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#a0a0b0" text-anchor="middle">Classic puzzle games built with React</text>

  <!-- Game labels -->
  <text x="300" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#e94560" text-anchor="middle">15 Puzzle</text>
  <text x="600" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#f9b208" text-anchor="middle">Hangman</text>
  <text x="900" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#4ecca3" text-anchor="middle">Memory</text>
</svg>
